[workspace]
resolver = "3"

[package]
name = "nb-mcp-server"
version = "0.14.0"
edition = "2024"
rust-version = "1.88"
description = "MCP server wrapping the nb CLI for LLM-friendly note-taking"
license = "Apache-2.0"
repository = "https://github.com/emcd/nb-mcp-server"
homepage = "https://github.com/emcd/nb-mcp-server"
documentation = "https://docs.rs/nb-mcp-server"
readme = "README.md"
keywords = ["mcp", "nb", "notes", "cli", "llm"]
categories = ["command-line-utilities", "development-tools"]
include = [
    "/src/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/CHANGELOG.md",
    "/README.md",
    "/LICENSE",
]

[[bin]]
name = "nb-mcp"
path = "src/main.rs"

[dependencies]
# nb API primitives
nb-api = { version = "0.2.1", features = ["schemars"] }

# MCP server framework
rmcp = { version = "1.6.0", features = ["transport-io"] }

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# JSON Schema generation for tool parameters
schemars = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Text processing
regex = "1.0"

[dev-dependencies]
# nb API testing fixture, only used by integration suites that need real-nb semantics
nb-api = { version = "0.2.1", features = ["schemars", "testing"] }
